name: note-voice

services:
  api:
    build: ../backend
    env_file: ../.env
    ports: ["127.0.0.1:8001:8000"]   # only nginx can reach it
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16
    env_file: ../.env
    volumes: ["pgdata:/var/lib/postgresql/data"]   # 5432 is not published
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  pgdata:
