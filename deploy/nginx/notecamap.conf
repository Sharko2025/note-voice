# /etc/nginx/sites-available/notecamap.conf
# Install: see deploy/README.md. certbot --nginx adds the 443 block and the 80 -> 443 redirect.

limit_req_zone $binary_remote_addr zone=notecamap:1m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name notecamap.s-itpro.com;

    client_max_body_size 10M;

    # Never log the Authorization header or bodies; default access log has neither.
    access_log /var/log/nginx/notecamap.access.log;
    error_log  /var/log/nginx/notecamap.error.log;

    location /api/ {
        limit_req zone=notecamap burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_request_buffering on;
    }

    location / {
        return 404;
    }
}
